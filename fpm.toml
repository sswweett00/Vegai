name = "vegai-hds"
version = "0.3.0"
license = "MIT"
author = "Vegai contributors"
maintainer = "Vegai contributors"
description = "Fortran 2023 verified 16,384-bit VSA/HDC engine with tokenizer-free byte-event fields, Resonator factorization, streaming corpus pretraining, and grounded TSV dialogue retrieval"
categories = ["artificial-intelligence", "symbolic-reasoning", "high-performance-computing"]
keywords = ["vsa", "hdc", "hyperdimensional", "fortran", "symbolic-ai", "grounded-retrieval"]

[build]
auto-executables = true
auto-tests = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[install]
library = true
