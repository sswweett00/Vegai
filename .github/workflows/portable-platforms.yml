name: Portable platform verification

on:
  push:
    paths:
      - 'app/**'
      - 'src/**'
      - 'test/**'
      - 'examples/corpus/toy_hdc_corpus.txt'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/portable-platforms.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'test/**'
      - 'examples/corpus/toy_hdc_corpus.txt'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/portable-platforms.yml'

permissions:
  contents: read

# This workflow targets the serial portable preset without a mandatory OpenMP,
# vendor GPU/NPU or host-ISA runtime dependency. A definition is not evidence of
# a passing runner; inspect each actual OS/architecture result independently.
# Native profile and same-host runtime checks require no Python. Native
# Fortran does not discover OS/CPU inventory; supply those details separately.
jobs:
  linux-portable:
    name: Linux portable (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install portable Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran cmake ninja-build

      - name: Configure and build serial portable preset
        run: |
          cmake --preset portable-serial -DVEGAI_BUILD_TESTS=OFF
          cmake --build --preset portable-serial --parallel

      - name: Run native Fortran control/profile/resource/checkpoint/attestation contract
        run: |
          ./build/portable-serial/vegai_control profile --format json
          ./build/portable-serial/vegai_control resource-plan examples/corpus/toy_hdc_corpus.txt \
            --checkpoint build/portable-serial/fortran-control-plan.vgai --max-vocab 64 \
            --available-memory-bytes 8589934592 --available-storage-bytes 8589934592 --require-ready
          ./build/portable-serial/vegai_control smoke examples/corpus/toy_hdc_corpus.txt \
            build/portable-serial/fortran-control-smoke.vgai
          ./build/portable-serial/vegai_control attest examples/corpus/toy_hdc_corpus.txt \
            build/portable-serial/fortran-control-smoke.vgai --format json

      - name: Validate same-host portable engine/train/inspect contract
        run: |
          cmake -DENGINE="$PWD/build/portable-serial/hds_engine" \
            -DPRETRAIN="$PWD/build/portable-serial/vegai_pretrain" \
            -DCORPUS="$PWD/examples/corpus/toy_hdc_corpus.txt" -DWORK_ROOT="$RUNNER_TEMP" \
            -P test/native_portable_runtime.cmake
          cmake -DCONTROL="$PWD/build/portable-serial/vegai_control" \
            -DCORPUS="$PWD/examples/corpus/toy_hdc_corpus.txt" -DWORK_ROOT="$RUNNER_TEMP" \
            -P test/native_control_regression.cmake
          cmake -DEXTRACT="$PWD/build/portable-serial/vegai_ud_text_extract" -DWORK_ROOT="$RUNNER_TEMP" \
            -P test/native_ud_text_extract.cmake

  macos-arm64-portable:
    name: macOS ARM64 portable
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install GNU Fortran and Ninja
        shell: bash
        run: |
          brew install gcc ninja
          compiler=""
          for candidate in "$(brew --prefix gcc)"/bin/gfortran-*; do
            if [ -x "$candidate" ]; then
              compiler="$candidate"
            fi
          done
          test -n "$compiler"
          echo "FC=$compiler" >> "$GITHUB_ENV"

      - name: Configure and build serial portable preset
        shell: bash
        run: |
          cmake --preset portable-serial -DVEGAI_BUILD_TESTS=OFF -DCMAKE_Fortran_COMPILER="$FC"
          cmake --build --preset portable-serial --parallel

      - name: Run native Fortran control/profile/resource/checkpoint/attestation contract
        shell: bash
        run: |
          ./build/portable-serial/vegai_control profile --format json
          ./build/portable-serial/vegai_control resource-plan examples/corpus/toy_hdc_corpus.txt \
            --checkpoint build/portable-serial/fortran-control-plan.vgai --max-vocab 64 \
            --available-memory-bytes 8589934592 --available-storage-bytes 8589934592 --require-ready
          ./build/portable-serial/vegai_control smoke examples/corpus/toy_hdc_corpus.txt \
            build/portable-serial/fortran-control-smoke.vgai
          ./build/portable-serial/vegai_control attest examples/corpus/toy_hdc_corpus.txt \
            build/portable-serial/fortran-control-smoke.vgai --format json

      - name: Validate same-host portable engine/train/inspect contract
        shell: bash
        run: |
          cmake -DENGINE="$PWD/build/portable-serial/hds_engine" \
            -DPRETRAIN="$PWD/build/portable-serial/vegai_pretrain" \
            -DCORPUS="$PWD/examples/corpus/toy_hdc_corpus.txt" -DWORK_ROOT="$RUNNER_TEMP" \
            -P test/native_portable_runtime.cmake
          cmake -DCONTROL="$PWD/build/portable-serial/vegai_control" \
            -DCORPUS="$PWD/examples/corpus/toy_hdc_corpus.txt" -DWORK_ROOT="$RUNNER_TEMP" \
            -P test/native_control_regression.cmake
          cmake -DEXTRACT="$PWD/build/portable-serial/vegai_ud_text_extract" -DWORK_ROOT="$RUNNER_TEMP" \
            -P test/native_ud_text_extract.cmake

  windows-x86_64-portable:
    name: Windows x86_64 portable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install MinGW-w64 GNU Fortran toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure and build serial portable preset
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --preset portable-serial -DVEGAI_BUILD_TESTS=OFF
          cmake --build --preset portable-serial --parallel

      - name: Run native Fortran control/profile/resource/checkpoint/attestation contract
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./build/portable-serial/vegai_control.exe profile --format json
          ./build/portable-serial/vegai_control.exe resource-plan examples/corpus/toy_hdc_corpus.txt \
            --checkpoint build/portable-serial/fortran-control-plan.vgai --max-vocab 64 \
            --available-memory-bytes 8589934592 --available-storage-bytes 8589934592 --require-ready
          ./build/portable-serial/vegai_control.exe smoke examples/corpus/toy_hdc_corpus.txt \
            build/portable-serial/fortran-control-smoke.vgai
          ./build/portable-serial/vegai_control.exe attest examples/corpus/toy_hdc_corpus.txt \
            build/portable-serial/fortran-control-smoke.vgai --format json

      - name: Validate same-host portable engine/train/inspect contract
        shell: msys2 {0}
        run: |
          set -euo pipefail
          root="$(cygpath -m "$PWD")"
          work="$(cygpath -m "$RUNNER_TEMP")"
          run_contract() {
            local name="$1" output status detail
            shift
            if output=$("$@" 2>&1); then
              printf '%s\n' "$output"
            else
              status=$?
              printf '%s\n' "$output" >&2
              detail=${output: -4000}
              detail=${detail//'%'/'%25'}
              detail=${detail//$'\r'/'%0D'}
              detail=${detail//$'\n'/'%0A'}
              printf '::error title=Portable %s::%s\n' "$name" "$detail"
              return "$status"
            fi
          }
          run_contract runtime cmake -DENGINE="$root/build/portable-serial/hds_engine.exe" \
            -DPRETRAIN="$root/build/portable-serial/vegai_pretrain.exe" \
            -DCORPUS="$root/examples/corpus/toy_hdc_corpus.txt" -DWORK_ROOT="$work" \
            -P test/native_portable_runtime.cmake
          run_contract control cmake -DCONTROL="$root/build/portable-serial/vegai_control.exe" \
            -DCORPUS="$root/examples/corpus/toy_hdc_corpus.txt" -DWORK_ROOT="$work" \
            -P test/native_control_regression.cmake
          run_contract ud-extract cmake -DEXTRACT="$root/build/portable-serial/vegai_ud_text_extract.exe" -DWORK_ROOT="$work" \
            -P test/native_ud_text_extract.cmake
