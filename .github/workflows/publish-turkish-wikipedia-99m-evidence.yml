name: Publish verified Turkish Wikipedia 99M evidence

on:
  pull_request:
    paths:
      - .github/workflows/publish-turkish-wikipedia-99m-evidence.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    # It consumes only a completed same-repository artifact; it does not check
    # out or execute PR source code with its write-capable token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Extract immutable Turkish 99M evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Locate successful real-data evidence artifact
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_run=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/turkish-wikipedia-99m-evidence.yml/runs" \
            -f event=push -f branch="${HEAD_REF}" -f status=success -f per_page=20 \
            --jq '.workflow_runs[0].id')
          [[ "$source_run" =~ ^[0-9]+$ ]] || {
            echo "No successful Turkish Wikipedia 99M evidence workflow was found for ${HEAD_REF}." >&2
            exit 1
          }
          artifact_name=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${source_run}/artifacts" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("turkish-wikipedia-99m-evidence-"))) | .name' \
            | head -n 1)
          [ -n "$artifact_name" ] || {
            echo "The successful 99M source run has no compact evidence artifact." >&2
            exit 1
          }
          echo "run_id=$source_run" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download immutable compact evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/vegai-turkish-wikipedia-99m-evidence"
          mkdir -p "$evidence_dir"
          gh run download "${{ steps.source.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" \
            --name "${{ steps.source.outputs.artifact_name }}" --dir "$evidence_dir"
          report=$(find "$evidence_dir" -type f -name experiment-report.json -print -quit)
          [ -n "$report" ] && [ -f "$report" ] || {
            echo "The 99M evidence artifact omitted experiment-report.json." >&2
            exit 1
          }
          echo "REPORT=$report" >> "$GITHUB_ENV"

      - name: Verify strict gates and format actual inference results
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$REPORT" "${{ steps.source.outputs.run_id }}" "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/comment.md" <<'PY'
          import json
          import math
          import shlex
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          run_id, repository = sys.argv[2:]

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"Evidence invariant failed: {message}")

          def finite_fraction(value, label):
              require(isinstance(value, (int, float)) and not isinstance(value, bool)
                      and math.isfinite(value) and 0.0 <= value <= 1.0,
                      f"{label} is not a finite [0,1] metric")
              return float(value)

          def finite_positive(value, label):
              require(isinstance(value, (int, float)) and not isinstance(value, bool)
                      and math.isfinite(value) and value > 0.0,
                      f"{label} is not a positive finite metric")
              return float(value)

          def plain(value):
              return str(value).replace("`", "\\`").replace("\r", " ").replace("\n", " ")

          require(report.get("schema") == "vegai-turkish-wikipedia-99m-experiment/v1", "unexpected report schema")
          require(report.get("status") == "succeeded", "experiment status is not succeeded")
          corpus = report.get("corpus")
          training = report.get("training")
          provenance = report.get("provenance")
          checkpoint = report.get("checkpoint")
          semantic = report.get("semantic_retrieval")
          heldout = report.get("heldout_inference_quality")
          grounded = report.get("grounded_dialogue")
          require(all(isinstance(value, dict) for value in (corpus, training, provenance, checkpoint, semantic, heldout, grounded)),
                  "required report section is missing")
          output = corpus.get("output")
          selection = corpus.get("selection")
          require(isinstance(output, dict) and isinstance(selection, dict), "corpus output/selection missing")
          require(output.get("native_token_count") == 99_000_000, "corpus does not contain exactly 99,000,000 native tokens")
          require(selection.get("minimum_tokens_per_output_record") == 2 and selection.get("maximum_tokens_per_output_record") == 128,
                  "record-width contract differs from 2–128")
          for field in ("non_ascii_bytes", "crlf_records", "overlong_records", "tokenizer_truncations"):
              require(output.get(field) == 0, f"corpus {field} is nonzero")
          metrics = training.get("metrics")
          require(isinstance(metrics, dict), "native metric mapping missing")
          for field in ("raw tokens", "active tokens", "prototype updates"):
              require(metrics.get(field) == 198_000_000, f"native {field} is not 99M × two epochs")
          require(metrics.get("out-of-vocabulary tokens") == 0, "native OOV telemetry is nonzero")
          for field in ("tokenizer truncations", "non-ASCII input bytes", "dropped overlong records"):
              require(metrics.get(field) == 0, f"native {field} is nonzero")
          seconds = finite_positive(training.get("train_process_wall_seconds"), "training seconds")
          throughput = finite_positive(training.get("raw_training_tokens_per_second"), "training throughput")
          command = training.get("command")
          require(isinstance(command, list) and command, "recorded training command missing")
          source = provenance.get("Turkish_Wikipedia_training_source")
          faq = provenance.get("separate_grounded_dialogue_source")
          require(isinstance(source, dict) and isinstance(faq, dict), "source provenance missing")
          source_urls = source.get("source_urls")
          archive_shards = source.get("archive_shards")
          require(isinstance(source_urls, list) and source_urls and all(isinstance(url, str) and url.startswith("https://") for url in source_urls),
                  "training source URLs are missing or not HTTPS")
          require(isinstance(archive_shards, list) and archive_shards and len(archive_shards) == len(source_urls),
                  "training archive shard provenance is incomplete")
          for ordinal, shard in enumerate(archive_shards, start=1):
              require(isinstance(shard, dict), f"archive shard {ordinal} is not an object")
              require(isinstance(shard.get("source_file"), str) and shard["source_file"],
                      f"archive shard {ordinal} lacks a source file name")
              require(shard.get("source_url") == source_urls[ordinal - 1],
                      f"archive shard {ordinal} URL differs from ordered source URL provenance")
              identity = shard.get("downloaded_archive")
              require(isinstance(identity, dict), f"archive shard {ordinal} identity missing")
              digest = identity.get("sha256")
              byte_count = identity.get("bytes")
              require(isinstance(digest, str) and len(digest) == 64 and
                      all(character in "0123456789abcdef" for character in digest),
                      f"archive shard {ordinal} SHA-256 is invalid")
              require(isinstance(byte_count, int) and byte_count > 0,
                      f"archive shard {ordinal} byte count is invalid")
          quality_metrics = heldout.get("metrics")
          quality_stats = heldout.get("heldout_source_statistics")
          require(isinstance(quality_metrics, dict) and isinstance(quality_stats, dict), "held-out metrics/statistics missing")
          require(isinstance(quality_metrics.get("eligible_queries"), int) and quality_metrics["eligible_queries"] >= 32,
                  "held-out evaluation did not contain at least 32 eligible real queries")
          exact = finite_fraction(quality_metrics.get("exact_top1_agreement"), "exact agreement")
          observed = finite_fraction(quality_metrics.get("checkpoint_prediction_observed_in_heldout_window_rate"), "observed rate")
          mrr = finite_fraction(quality_metrics.get("mean_reciprocal_rank_by_heldout_association"), "MRR")
          require(isinstance(semantic.get("results"), list) and len(semantic["results"]) == 11,
                  "semantic probe count is not eleven")
          require(isinstance(grounded.get("results"), list) and len(grounded["results"]) == 11,
                  "grounded result count is not eleven")
          require(all(row.get("grounded") is True for row in grounded["results"]),
                  "one or more grounded requests abstained")

          print(f"<!-- vegai-turkish-wikipedia-99m-evidence:{run_id} -->")
          print("## Verified real Turkish Wikipedia 99M-native-token evidence")
          print()
          print(f"Source workflow: [{run_id}](https://github.com/{repository}/actions/runs/{run_id})")
          print()
          print("### Provenance and exact corpus gate")
          print()
          print(f"- Source: `{plain(source['dataset_project_url'])}`, dump revision `{plain(source['dump_revision'])}`, declared license `{plain(source['declared_license'])}`.")
          print(f"- Official status: `{plain(source['status_url'])}`; dump-status manifest SHA-256: `{plain(source['dump_status_manifest']['sha256'])}`.")
          print(f"- Complete pages-articles source: `{len(archive_shards)}` official archive shard(s), all SHA-256 verified by the controller:")
          for shard in archive_shards:
              identity = shard['downloaded_archive']
              print(f"  - `{plain(shard['source_file'])}` — `{plain(identity['sha256'])}`, `{identity['bytes']:,}` bytes; {plain(shard['source_url'])}")
          print(f"- Output corpus SHA-256: `{plain(output['sha256'])}`; exactly **{output['native_token_count']:,}** native tokens in `{output['physical_lf_records']:,}` LF records.")
          print(f"- Record contract: {selection['minimum_tokens_per_output_record']}–{selection['maximum_tokens_per_output_record']} tokens; strict non-ASCII/CRLF/overlong/truncation counters are zero.")
          print(f"- Article partition: `{plain(corpus['source_partition']['partition']['id'])}`; train pages `{corpus['source_partition']['train_articles']:,}`, held-out pages `{corpus['source_partition']['heldout_articles']:,}`.")
          print(f"- Independent grounded TSV: `{plain(faq['dataset_project_url'])}` at `{plain(faq['dataset_project_revision'])}`, license `{plain(faq['declared_license'])}`, SHA-256 `{plain(faq['dataset_file']['sha256'])}`.")
          print()
          print("### Native Fortran training")
          print()
          print(f"- Checkpoint SHA-256: `{plain(checkpoint['sha256'])}`.")
          print(f"- Train-child wall time: **{seconds:.6f} s**; total native update throughput: **{throughput:.3f} tokens/s**. Download, extraction, corpus preparation, inference, compilation, hashing, and CI are excluded.")
          print(f"- Native metrics: raw `{metrics['raw tokens']:,}`, active `{metrics['active tokens']:,}`, prototype updates `{metrics['prototype updates']:,}`, OOV `{metrics['out-of-vocabulary tokens']}`.")
          print(f"- RESONANT scope: {plain(training.get('resonant_epoch_feedback', 'not recorded'))}")
          print("- Recorded command:")
          print("  ```text")
          print(shlex.join(str(argument) for argument in command))
          print("  ```")
          print()
          print("### Real held-out native inference measurement")
          print()
          print(f"- Held-out active token occurrences: `{quality_stats['active_token_occurrences']:,}` across `{quality_stats['articles']:,}` page-disjoint articles.")
          print(f"- Eligible queries: `{quality_metrics['eligible_queries']}`; exact held-out association top-1 agreement: **{exact:.6f}**; predicted-neighbour observed-in-held-out-window rate: **{observed:.6f}**; MRR by held-out association rank: **{mrr:.6f}**.")
          print("- This is a real checkpoint inference result against source-held-out articles, but it is a narrow local-co-occurrence consistency measure—not a human semantic benchmark or a general Turkish NLP score.")
          print()
          print("### 11 checkpoint semantic nearest-neighbour results")
          print()
          print("| # | query | nearest semantic neighbour | bipolar similarity |")
          print("| ---: | --- | --- | ---: |")
          for ordinal, row in enumerate(semantic["results"], start=1):
              similarity = finite_fraction((float(row["bipolar_similarity"]) + 1.0) / 2.0, f"semantic[{ordinal}] transformed similarity")
              del similarity
              print(f"| {ordinal} | `{plain(row['query'])}` | `{plain(row['nearest_semantic_neighbour'])}` | {float(row['bipolar_similarity']):.5f} |")
          print()
          print("### 11 literal grounded TSV responses")
          print()
          print("Every answer is the exact ASCII-normalized TSV field returned by native `vegai_chat`; it is not free-form LLM output.")
          print()
          for row in grounded["results"]:
              best = finite_fraction((float(row["best_bipolar_similarity"]) + 1.0) / 2.0, f"grounded[{row['ordinal']}] best transformed")
              runner = finite_fraction((float(row["runner_up_bipolar_similarity"]) + 1.0) / 2.0, f"grounded[{row['ordinal']}] runner transformed")
              margin = finite_positive(float(row["grounding_margin"]), f"grounded[{row['ordinal']}] margin")
              del best, runner, margin
              answer = str(row["answer"]).replace("```", "``\\`")
              print(f"{row['ordinal']}. **Prompt:** `{plain(row['prompt'])}`")
              print(f"   - matched prompt: `{plain(row['matched_prompt'])}`; similarity `{float(row['best_bipolar_similarity']):.5f}`; runner-up `{float(row['runner_up_bipolar_similarity']):.5f}`; margin `{float(row['grounding_margin']):.5f}`")
              print(f"   - source: {plain(row['source_url'])} (row `{plain(row['source_row'])}`)")
              print("   - literal TSV answer:")
              print("     ```text")
              print(answer)
              print("     ```")
          print()
          print("> Scope: this establishes only the recorded real-data train/checkpoint/inference/retrieval execution. It does not establish factual correctness beyond cited sources, held-out human semantic performance, free-form generation, general language understanding, or general intelligence.")
          PY

      - name: Publish evidence to this pull request and workflow summary
        shell: bash
        run: |
          set -euo pipefail
          marker="vegai-turkish-wikipedia-99m-evidence:${{ steps.source.outputs.run_id }}"
          existing_comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
            --paginate --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | tail -n 1)
          if [ -n "$existing_comment" ]; then
            python3 - "$RUNNER_TEMP/comment.md" > "$RUNNER_TEMP/comment-patch.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          print(json.dumps({"body": Path(sys.argv[1]).read_text(encoding="utf-8")}))
          PY
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_comment}" \
              --input "$RUNNER_TEMP/comment-patch.json" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          fi
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
