name: Fortran verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GNU Fortran toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran cmake ninja-build

      - name: Configure checked OpenMP build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DVEGAI_ENABLE_OPENMP=ON \
            -DVEGAI_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_Fortran_FLAGS='-std=f2023 -fcheck=all -fbacktrace -ffpe-trap=invalid,zero,overflow'

      - name: Compile
        run: cmake --build build-ci --parallel

      - name: Run native Fortran property and integration tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: Run executable end-to-end verification
        run: |
          set +e
          OMP_NUM_THREADS=2 ./build-ci/hds_engine > demo-output.txt 2>&1
          exit_code=$?
          cat demo-output.txt
          {
            echo '## HDS executable verification output'
            echo '```text'
            cat demo-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$exit_code" -ne 0 ]; then
            detail=$(tail -n 4 demo-output.txt | tr '\n' ' ' | cut -c1-240)
            if [ -z "$detail" ]; then
              detail="hds_engine failed before emitting output"
            fi
            echo "::error file=app/main.f90,line=1,title=HDS demo diagnostic::$detail"
          fi
          exit "$exit_code"

      - name: Validate sample corpus manifests and ingest contracts
        run: |
          python3 tools/corpus_manifest.py examples/corpus/toy_hdc_corpus.txt \
            --output "${RUNNER_TEMP}/toy-manifest.json" \
            --source 'repository smoke fixture' --license MIT \
            --retrieved-at 'source-controlled fixture' --preprocessing none --strict-contract
          python3 -m json.tool "${RUNNER_TEMP}/toy-manifest.json" > /dev/null
          python3 tools/verify_example_corpus.py

      - name: Run HDC pretraining CLI smoke test
        run: |
          set -euo pipefail
          checkpoint="${RUNNER_TEMP}/vegai-smoke.vgai"
          ./build-ci/vegai_pretrain train examples/corpus/toy_hdc_corpus.txt "$checkpoint" \
            --max-vocab 64 --min-frequency 2 --window 2 --epochs 1 --query king
          ./build-ci/vegai_pretrain inspect "$checkpoint" --query dog
          ./build-ci/vegai_pretrain resume examples/corpus/toy_hdc_corpus.txt "$checkpoint" \
            --epochs 1 --query queen

      - name: Run independent Python reference verification
        run: python3 tools/verify_reference.py

      - name: Compile optimized GNU Make binaries
        run: make clean && make all

      - name: Compare optimized pretraining speed and semantic cohesion
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/pretraining-mode-comparison.json"
          python3 tools/compare_pretraining_modes.py \
            --pretrain-bin ./build/vegai_pretrain \
            --repetitions 3 --omp-threads 1 --output "$report" > /dev/null
          python3 - "$report" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              report = json.load(source)
          speed = report["speed"]
          quality = report["quality"]
          comparison = report["comparison"]
          message = (
              f"legacy_seconds={speed['legacy']['median_seconds']:.6f}; "
              f"positional_seconds={speed['positional']['median_seconds']:.6f}; "
              f"hybrid_seconds={speed['hybrid']['median_seconds']:.6f}; "
              f"legacy_tps={speed['legacy']['training_tokens_per_second']:.3f}; "
              f"positional_tps={speed['positional']['training_tokens_per_second']:.3f}; "
              f"hybrid_tps={speed['hybrid']['training_tokens_per_second']:.3f}; "
              f"positional_speedup={comparison['positional_speedup_vs_legacy']:.4f}x; "
              f"hybrid_speedup={comparison['hybrid_speedup_vs_legacy']:.4f}x; "
              f"legacy_similarity={quality['legacy']['mean_top1_similarity']:.6f}; "
              f"hybrid_similarity={quality['hybrid']['mean_top1_similarity']:.6f}; "
              f"hybrid_top1={quality['hybrid']['same_cluster_top1_percent']:.3f}%; "
              f"semantic_similarity_gain={comparison['hybrid_mean_top1_similarity_gain_vs_positional']:.6f}"
          )
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("## Optimized pretraining comparison\n\n")
              summary.write("Optimized Make binary; each timing sample covers one `vegai_pretrain train` process only.\n\n")
              summary.write("| Mode | Median seconds | Training token/s | Controlled Top-1 cluster | Mean Top-1 similarity |\n")
              summary.write("|---|---:|---:|---:|---:|\n")
              for mode in ("legacy", "positional", "hybrid"):
                  summary.write(
                      f"| {mode} | {speed[mode]['median_seconds']:.6f} | "
                      f"{speed[mode]['training_tokens_per_second']:.3f} | "
                      f"{quality[mode]['same_cluster_top1_percent']:.3f}% | "
                      f"{quality[mode]['mean_top1_similarity']:.6f} |\n"
                  )
              summary.write(f"\n```text\n{message}\n```\n")
          print(f"::notice title=Optimized pretraining comparison::{message}")
          PY
